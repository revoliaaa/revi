<!-- ============ Siluet hutan di tepi bawah panel Simpulan ============ -->
<svg class="el" style="left:0pt; top:3332pt; width:2384pt; height:38.32pt" viewBox="0 0 2384 38.32" preserveAspectRatio="none">
  <g fill="#2A9C8C" opacity=".6" id="skyline"></g>
</svg>

<script>
  // Siluet hutan prosedural (deterministik) untuk tepi bawah
  const g = document.getElementById('skyline');
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  let x = 0, d = 'M0 38.32';
  while (x < 2384) {
    const w = 14 + rnd() * 26, h = 6 + rnd() * 14, type = rnd();
    if (type < 0.55) { // kanopi bulat
      d += ` L${x} 38.32 L${x} ${38.32 - h * 0.55} Q${x} ${38.32 - h} ${x + w / 2} ${38.32 - h} Q${x + w} ${38.32 - h} ${x + w} ${38.32 - h * 0.55}`;
    } else { // pohon runcing
      d += ` L${x} 38.32 L${x + w / 2} ${38.32 - h * 1.1} L${x + w} 38.32`;
    }
    x += w * (0.7 + rnd() * 0.3);
  }
  d += ' L2384 38.32 Z';
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', d); g.appendChild(p);
</script>
