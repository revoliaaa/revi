  <g id="text_22">
   <text style="font-weight: 700; font-size: 26px; font-family: 'Liberation Sans', 'DejaVu Sans'; text-anchor: start; fill: #24343d" x="12.245669" y="36.645246" transform="rotate(-0 12.245669 36.645246)">Manfaat program dan potensi kehilangan pendapatan RT</text>
  </g>
  <g id="text_23">
   <text style="font-size: 18.5px; font-family: 'Liberation Sans', 'DejaVu Sans'; text-anchor: start; fill: #24343d" x="12.245669" y="73.704726" transform="rotate(-0 12.245669 73.704726)">Kedua komponen dihitung pada skala yang sama; besaran kehilangan bergantung pada asumsi pembatasan akses</text>
  </g>
  <g id="text_24">
   <text style="font-size: 14.5px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #4a5a63" transform="translate(12.245669 639.609714)">Manfaat program = pendapatan program per RT; kehilangan akses = rata-rata per RT, asumsi model (kelas D), bukan kerugian terukur. Keduanya</text>
   <text style="font-size: 14.5px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #4a5a63" transform="translate(12.245669 657.980393)">komponen, bukan perubahan total pendapatan terhadap baseline (rerata pendapatan bersih RT S1: Rp41,25 juta/RT/tahun). Sensitivitas:</text>
   <text style="font-size: 14.5px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #4a5a63" transform="translate(12.245669 676.351072)">pengali kehilangan akses diuji 0–3,24; PRCC terhadap pendapatan RT −0,79. Tanpa kehilangan akses, selisih pendapatan S4−S3 menjadi</text>
   <text style="font-size: 14.5px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #4a5a63" transform="translate(12.245669 694.72175)">+Rp34.402 (USD10) dan +Rp118.629 (USD20). Sumber: teks hlm. 8–9 makalah; FINAL_THESIS_RESULTS.xlsx lembar 1A.</text>
  </g>
 </g>
