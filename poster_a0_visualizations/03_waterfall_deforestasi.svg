  </g>
  <g id="text_20">
   <text style="font-size: 14.5px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #4a5a63" transform="translate(12.245669 685.986692)">Deforestasi dihindari = selisih deforestasi kumulatif antarskenario. S1 tanpa PS aktif; S2 PS swadaya; S3 S2 + pembiayaan awal 2024–2025;</text>
   <text style="font-size: 14.5px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #4a5a63" transform="translate(12.245669 704.357371)">S4 S3 + perdagangan karbon USD20/tCO₂e. Label dibulatkan; total dari nilai presisi (1.720,4 + 276,3 + 3.588,2 = 5.584,9 ha), sehingga</text>
   <text style="font-size: 14.5px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #4a5a63" transform="translate(12.245669 722.72805)">jumlah label (5.584) berbeda 1 ha. Hasil model, bukan dampak kausal terukur. Sumber: Tabel 4 makalah; FINAL_THESIS_RESULTS.xlsx lembar 2.</text>
  </g>
